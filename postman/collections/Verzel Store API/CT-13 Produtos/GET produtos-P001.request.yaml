$kind: http-request
name: GET produtos/P001
url: "{{base}}/produtos/P001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("Camiseta Essencial, preco 59.9", () => { const j = pm.response.json(); pm.expect(j.nome).to.eql("Camiseta Essencial"); pm.expect(j.preco).to.eql(59.9); });
    language: text/javascript
order: 2000
