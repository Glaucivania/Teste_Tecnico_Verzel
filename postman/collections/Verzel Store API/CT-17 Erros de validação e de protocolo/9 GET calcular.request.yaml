$kind: http-request
url: "{{base}}/carrinho/calcular"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 405", () => pm.response.to.have.status(405));
      pm.test("erro.codigo METODO_NAO_PERMITIDO", () => pm.expect(pm.response.json().erro.codigo).to.eql("METODO_NAO_PERMITIDO"));
    language: text/javascript
order: 9000
