$kind: http-request
url: "{{base}}/rota-inexistente"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 404", () => pm.response.to.have.status(404));
      pm.test("erro.codigo ROTA_NAO_ENCONTRADA", () => pm.expect(pm.response.json().erro.codigo).to.eql("ROTA_NAO_ENCONTRADA"));
    language: text/javascript
order: 10000
