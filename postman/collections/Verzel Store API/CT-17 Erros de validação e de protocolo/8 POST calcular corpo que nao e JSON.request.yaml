$kind: http-request
url: "{{base}}/carrinho/calcular"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: nao e json
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 400", () => pm.response.to.have.status(400));
      pm.test("erro.codigo JSON_INVALIDO", () => pm.expect(pm.response.json().erro.codigo).to.eql("JSON_INVALIDO"));
    language: text/javascript
order: 8000
