$kind: http-request
url: "{{base}}/carrinho/calcular"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "itens": [
        {
          "produtoId": "P001",
          "quantidade": 6
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 422", () => pm.response.to.have.status(422));
      pm.test("erro.codigo QUANTIDADE_MAXIMA_EXCEDIDA", () => pm.expect(pm.response.json().erro.codigo).to.eql("QUANTIDADE_MAXIMA_EXCEDIDA"));
    language: text/javascript
order: 1000
