$kind: http-request
url: "{{base}}/carrinho/calcular"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "itens": [
        {
          "produtoId": "P007",
          "quantidade": 1
        }
      ],
      "cupom": "BEMVINDO10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("API igual ao resumo da tela (subtotal 229,90, desconto 22,99, frete Grátis, total 206,91)", () => { const j = pm.response.json(); pm.expect(j.subtotal).to.eql(229.9); pm.expect(j.desconto).to.eql(22.99); pm.expect(j.frete).to.eql(0); pm.expect(j.total).to.eql(206.91); });
      pm.test("freteGratis true e faltante 0, como a tela (sem aviso de frete)", () => { const j = pm.response.json(); pm.expect(j.freteGratis).to.eql(true); pm.expect(j.valorFaltanteFreteGratis).to.eql(0); });
    language: text/javascript
order: 4000
